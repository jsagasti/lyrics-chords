<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Lyrics &amp; Chords</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header id="bar">
    <button id="btn-songs" class="ctrl" title="Canciones" aria-label="Canciones">&#9776;</button>
    <div id="title">Cargando&hellip;</div>
    <button id="btn-refresh" class="ctrl" title="Recargar" aria-label="Recargar">&#8635;</button>
  </header>

  <div id="main">
    <main id="stage">
      <div id="song"></div>
    </main>

    <nav id="controls" aria-label="Controles">
      <div class="cgroup" title="Transponer">
        <span class="clabel">Tono</span>
        <button id="tr-up" class="cbtn" aria-label="Subir tono">&plus;</button>
        <span id="tr-val" class="cval">0</span>
        <button id="tr-down" class="cbtn" aria-label="Bajar tono">&minus;</button>
      </div>

      <div class="cgroup cgroup-scroll" title="Auto-scroll">
        <span class="clabel">Scroll</span>
        <button id="btn-scroll" class="cbtn cbtn-primary" aria-label="Iniciar o parar auto-scroll">&#9654;</button>
        <button id="spd-up" class="cbtn" aria-label="Más rápido">&plus;</button>
        <span id="spd-val" class="cval">6</span>
        <button id="spd-down" class="cbtn" aria-label="Más lento">&minus;</button>
      </div>

      <div class="cgroup" title="Tamaño de letra">
        <span class="clabel">Letra</span>
        <button id="btn-font-up" class="cbtn" aria-label="Más grande">A&plus;</button>
        <button id="btn-font-down" class="cbtn" aria-label="Más chico">A&minus;</button>
      </div>
    </nav>
  </div>

  <aside id="drawer" hidden>
    <div class="drawer-head">
      <span>Canciones</span>
      <button id="btn-close" class="ctrl" aria-label="Cerrar">&times;</button>
    </div>

    <div class="addbox">
      <div class="addrow">
        <input id="add-input" type="search" placeholder="Buscar canción para agregar (IA)&hellip;" autocomplete="off" />
        <button id="btn-add-search" class="ctrl" aria-label="Buscar">Buscar</button>
      </div>
      <div id="add-results"></div>
      <div id="add-status" class="addstatus" hidden></div>
    </div>

    <input id="filter" type="search" placeholder="Filtrar biblioteca&hellip;" autocomplete="off" />
    <div id="song-list"></div>

    <div id="drawer-foot">
      <span id="foot-count"></span>
      <button id="btn-reorg" class="linkbtn">Reordenar (IA)</button>
    </div>
  </aside>

  <div id="scrim" hidden></div>

  <div id="ctxmenu" hidden></div>

  <div id="editor" hidden>
    <div class="editor-head">
      <span id="editor-title">Editar</span>
      <span class="editor-actions">
        <button id="editor-cancel" class="ctrl">Cancelar</button>
        <button id="editor-save" class="ctrl cbtn-primary">Guardar</button>
      </span>
    </div>
    <textarea id="editor-text" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
  </div>

  <div id="formmodal" hidden>
    <div class="form-box">
      <div id="form-title" class="form-title"></div>
      <div id="form-fields"></div>
      <div class="form-actions">
        <button id="form-cancel" class="ctrl">Cancelar</button>
        <button id="form-ok" class="ctrl cbtn-primary">OK</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
