<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Lyrics &amp; Chords</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header id="bar">
    <button id="btn-songs" class="ctrl" title="Song list" aria-label="Song list">&#9776;</button>
    <div id="title">Loading&hellip;</div>
    <button id="btn-refresh" class="ctrl" title="Reload songs from server" aria-label="Refresh">&#8635;</button>
  </header>

  <div id="main">
    <main id="stage">
      <div id="song"></div>
    </main>

    <nav id="controls" aria-label="Playback controls">
      <div class="cgroup" title="Transpose">
        <span class="clabel">Key</span>
        <button id="tr-up" class="cbtn" aria-label="Transpose up">&plus;</button>
        <span id="tr-val" class="cval">0</span>
        <button id="tr-down" class="cbtn" aria-label="Transpose down">&minus;</button>
      </div>

      <div class="cgroup cgroup-scroll" title="Auto-scroll">
        <span class="clabel">Scroll</span>
        <button id="btn-scroll" class="cbtn cbtn-primary" aria-label="Start or stop auto-scroll">&#9654;</button>
        <button id="spd-up" class="cbtn" aria-label="Faster">&plus;</button>
        <span id="spd-val" class="cval">6</span>
        <button id="spd-down" class="cbtn" aria-label="Slower">&minus;</button>
      </div>

      <div class="cgroup" title="Text size">
        <span class="clabel">Size</span>
        <button id="btn-font-up" class="cbtn" aria-label="Larger text">A&plus;</button>
        <button id="btn-font-down" class="cbtn" aria-label="Smaller text">A&minus;</button>
      </div>
    </nav>
  </div>

  <aside id="drawer" hidden>
    <div class="drawer-head">
      <span>Songs</span>
      <button id="btn-close" class="ctrl" aria-label="Close">&times;</button>
    </div>
    <input id="filter" type="search" placeholder="Filter&hellip;" autocomplete="off" />
    <ul id="song-list"></ul>
    <div id="drawer-foot"></div>
  </aside>

  <div id="scrim" hidden></div>

  <script src="app.js"></script>
</body>
</html>
