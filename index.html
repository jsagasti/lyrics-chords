<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Lyrics &amp; Chords</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header id="bar">
    <button id="btn-songs" class="ctrl" title="Song list" aria-label="Song list">&#9776;</button>
    <div id="title">Loading&hellip;</div>

    <div class="group" title="Transpose">
      <button id="tr-down" class="ctrl" aria-label="Transpose down">&minus;</button>
      <span id="tr-val" class="readout">0</span>
      <button id="tr-up" class="ctrl" aria-label="Transpose up">+</button>
    </div>

    <button id="btn-scroll" class="ctrl" aria-label="Start or stop auto-scroll">&#9654;</button>
    <input id="speed" type="range" min="1" max="100" value="30" title="Scroll speed" />

    <button id="btn-refresh" class="ctrl" title="Reload songs from server" aria-label="Refresh">&#8635;</button>
    <button id="btn-font-down" class="ctrl" aria-label="Smaller text">A&minus;</button>
    <button id="btn-font-up" class="ctrl" aria-label="Larger text">A+</button>
  </header>

  <main id="stage">
    <div id="song"></div>
  </main>

  <aside id="drawer" hidden>
    <div class="drawer-head">
      <span>Songs</span>
      <button id="btn-close" class="ctrl" aria-label="Close">&times;</button>
    </div>
    <input id="filter" type="search" placeholder="Filter&hellip;" autocomplete="off" />
    <ul id="song-list"></ul>
    <div id="drawer-foot"></div>
  </aside>

  <div id="scrim" hidden></div>

  <script src="app.js"></script>
</body>
</html>
